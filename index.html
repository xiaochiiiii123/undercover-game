<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>誰是臥底：AI 偵探版 v4</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-soft: #162033;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 14px 14px 44px;
        }
        .app {
            max-width: 520px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .title-group h1 {
            font-size: 1.3rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .subtitle-row p {
            font-size: 0.78rem;
            color: var(--muted);
        }
        .preload-badge {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: bold;
            display: none;
        }
        .preload-badge.loading {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.35);
        }
        .preload-badge.ready {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .icon-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 主題與難度設定面板 */
        .setup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .setup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .setup-summary {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mini-badge {
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 6px;
            background: #0f172a;
            color: var(--accent);
            border: 1px solid var(--border);
        }
        .mini-badge.diff-easy { color: #86efac; border-color: rgba(34,197,94,0.4); }
        .mini-badge.diff-normal { color: #fde68a; border-color: rgba(245,158,11,0.4); }
        .mini-badge.diff-hell { color: #fca5a5; border-color: rgba(239,68,68,0.4); }
        .toggle-arrow {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .setup-body {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .setup-body.collapsed {
            display: none;
        }
        .section-label {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: bold;
        }
        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .chip {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #cbd5e1;
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .chip.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            font-weight: bold;
        }
        .custom-theme-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .custom-theme-row input {
            flex: 1;
            padding: 9px 11px;
            border-radius: 9px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text);
            font-size: 0.88rem;
        }
        .custom-theme-row input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .diff-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .diff-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #cbd5e1;
            border-radius: 10px;
            padding: 8px 4px;
            font-size: 0.84rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .diff-btn small {
            display: block;
            font-size: 0.68rem;
            font-weight: normal;
            color: var(--muted);
            margin-top: 2px;
        }
        .diff-btn.active.easy { border-color: var(--success); background: rgba(34,197,94,0.16); color: #86efac; }
        .diff-btn.active.normal { border-color: var(--warning); background: rgba(245,158,11,0.16); color: #fde68a; }
        .diff-btn.active.hell { border-color: var(--danger); background: rgba(239,68,68,0.16); color: #fca5a5; }

        /* 狀態列 */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-pill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: bold;
        }
        .stat-pill span {
            display: block;
            font-size: 0.72rem;
            color: var(--muted);
            font-weight: normal;
        }
        .message-box {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            background: var(--card);
            border-left: 4px solid var(--accent);
        }
        .message-box.won { background: rgba(34, 197, 94, 0.15); border-left-color: var(--success); color: #86efac; }
        .message-box.lost { background: rgba(239, 68, 68, 0.15); border-left-color: var(--danger); color: #fca5a5; }
        .hint-box {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--warning);
            color: #fde68a;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.88rem;
            margin-bottom: 12px;
        }
        .answer-reveal {
            background: var(--card);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.92rem;
        }
        .answer-words {
            display: flex;
            justify-content: space-around;
        }
        .answer-meta {
            font-size: 0.79rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .players {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .player-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }
        .player-card.eliminated { opacity: 0.5; }
        .player-card.spy-reveal { border: 2px solid var(--danger); background: rgba(239, 68, 68, 0.08); }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .player-name {
            font-size: 1.06rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag { font-size: 0.74rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-civ { background: #334155; color: #cbd5e1; }
        .tag-spy { background: var(--danger); color: white; }
        .clue-item {
            background: #0f172a;
            padding: 9px 11px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.92rem;
        }
        .clue-round {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
        .btn {
            width: 100%;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.94rem;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-accuse { background: var(--danger); color: white; margin-top: 4px; }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-warning { background: var(--warning); color: #0f172a; }
        .btn-secondary { background: #475569; color: white; }
        .btn-sm { padding: 9px 12px; font-size: 0.86rem; }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 讀取遮罩 & 設定彈窗 */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
        }
        .modal h2 { font-size: 1.15rem; margin-bottom: 12px; color: var(--accent); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.84rem; color: var(--muted); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text);
            font-size: 0.9rem;
        }
        .history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .link-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #334155;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="title-group">
            <h1>🕵️ 誰是臥底：偵探版</h1>
            <div class="subtitle-row">
                <p id="mode-label">目前模式：內建題庫</p>
                <span id="preload-badge" class="preload-badge"></span>
            </div>
        </div>
        <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
    </header>

    <!-- 主題與難度選擇器 -->
    <div class="setup-card">
        <div class="setup-header" onclick="toggleSetupPanel()">
            <div class="setup-summary">
                🎯
                <span id="summary-theme" class="mini-badge">主題：隨機</span>
                <span id="summary-diff" class="mini-badge diff-normal">難度：普通</span>
            </div>
            <span id="setup-arrow" class="toggle-arrow">展開調整 ▼</span>
        </div>
        <div id="setup-body" class="setup-body collapsed">
            <div class="section-label">1. 選擇主題（或直接輸入自訂主題）</div>
            <div id="theme-chips" class="chip-list"></div>
            <div class="custom-theme-row">
                <input type="text" id="custom-theme-input" placeholder="自訂主題（如：名偵探柯南、手遊、夜市）" oninput="onCustomThemeInput()">
            </div>

            <div class="section-label">2. 選擇推理難度</div>
            <div class="diff-group">
                <button class="diff-btn easy" data-diff="easy" onclick="selectDifficulty('easy')">
                    🟢 簡單<small>線索直白・2次機會</small>
                </button>
                <button class="diff-btn normal" data-diff="normal" onclick="selectDifficulty('normal')">
                    🟡 普通<small>經典平衡・2次機會</small>
                </button>
                <button class="diff-btn hell" data-diff="hell" onclick="selectDifficulty('hell')">
                    🔴 地獄<small>隱晦燒腦・1次機會</small>
                </button>
            </div>

            <button class="btn btn-primary btn-sm" onclick="applySetupAndRestart()">🚀 套用並開始新局</button>
        </div>
    </div>

    <div class="status-bar">
        <div class="stat-pill"><span>發言進度</span><div id="stat-round">第 1 / 2 輪</div></div>
        <div class="stat-pill"><span>剩餘機會</span><div id="stat-chances">❤️ 2 次</div></div>
        <div class="stat-pill"><span>目前連勝</span><div id="stat-streak">🔥 0 連勝</div></div>
    </div>

    <div id="message-box" class="message-box">載入中...</div>
    <div id="hint-box" class="hint-box" style="display:none;"></div>
    <div id="answer-reveal" class="answer-reveal" style="display:none;"></div>

    <div id="players-container" class="players"></div>

    <div id="controls" class="controls"></div>
</div>

<!-- 讀取中遮罩 -->
<div id="loading-overlay" class="overlay">
    <div style="text-align:center;">
        <div class="spinner"></div>
        <div style="font-weight:bold; color:var(--accent);">🕵️ AI 正在派發題目中...</div>
        <div style="font-size:0.8rem; color:var(--muted); margin-top:4px;">若超過 12 秒將自動切換內建題庫</div>
    </div>
</div>

<!-- 設定彈窗 -->
<div id="settings-overlay" class="overlay">
    <div class="modal">
        <h2>⚙️ 遊戲與 AI 設定</h2>
        <div class="form-group">
            <label>出題模式</label>
            <select id="setting-mode">
                <option value="offline">內建題庫（免等待、離線可玩）</option>
                <option value="ai">Gemini AI 即時出題（需填 API Key）</option>
            </select>
        </div>
        <div class="form-group">
            <label>Gemini API Key（僅儲存在你的手機瀏覽器）</label>
            <input type="password" id="setting-apikey" placeholder="貼上你的 API Key">
        </div>
        <div class="form-group">
            <label>AI 模型選擇</label>
            <select id="setting-model">
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（最快）</option>
                <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                <option value="gemini-4-hydrogen">gemini-4-hydrogen</option>
            </select>
        </div>
        <div class="history-row">
            <span id="history-count-text">防重複黑名單：已記錄 0 組詞彙</span>
            <button class="link-btn" onclick="clearHistory()">清除紀錄</button>
        </div>
        <div class="controls-row">
            <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
            <button class="btn btn-primary" onclick="saveSettings()">儲存並開新局</button>
        </div>
    </div>
</div>

<script>
const BOTS = [
    { id: 0, name: '小宇', avatar: '🦊' },
    { id: 1, name: '阿豪', avatar: '🐻' },
    { id: 2, name: '曉彤', avatar: '🐰' },
    { id: 3, name: '凱文', avatar: '🦉' }
];

const PRESET_THEMES = [
    '隨機', '台灣美食', '日常用品', '動漫遊戲', '校園日常', '3C科技', '交通旅遊', '影劇娛樂', '動物寵物'
];

const DIFF_CONFIG = {
    easy: {
        label: '簡單',
        chances: 2,
        promptRule: '難度為【簡單】：兩個詞必須屬於「同一個細分類、用途相似」（如：高鐵 vs 公車、珍珠奶茶 vs 紅茶），但差異明顯；每句線索描述具體直白，讓玩家比較容易聽出誰拿的詞不一樣。'
    },
    normal: {
        label: '普通',
        chances: 2,
        promptRule: '難度為【普通】：兩個詞必須屬於「同一個細分類、功能或外觀高度相似」（如：悠遊卡 vs 信用卡、行李箱 vs 登山包、鹹酥雞 vs 雞排）。線索自然像真人玩桌遊，帶點模糊空間，但仔細比對能發現破綻。'
    },
    hell: {
        label: '地獄',
        chances: 1,
        promptRule: '難度為【地獄】：兩個詞必須屬於「同一個細分類、極度容易搞混但本質不同」（如：拿鐵 vs 卡布奇諾、蚵仔煎 vs 蝦仁煎、高鐵 vs 自強號、藍牙耳機 vs 有線耳機）。第1輪發言請刻意講兩者的共通點混淆視聽，臥底的第2輪發言才暗藏一個細微但可推理的關鍵差異！'
    }
};

// 內建 16 組分類題庫
const OFFLINE_BANK = [
    {
        category: '台灣美食',
        wordA: '珍珠奶茶', cluesA: ['台灣最經典的國民手搖飲料。', '喝的時候一定要用比較粗的吸管。', '裡面有黑色圓圓的配料，嚼起來很Q。', '外國觀光客來台灣幾乎必點。', '熱量不低但下午茶喝一杯超療癒。', '通常可以選加奶精或鮮奶。'],
        wordB: '仙草凍奶茶', cluesB: ['飲料店常見的黑色加料奶茶。', '配料口感滑溜軟嫩，幾乎不用用力咬。', '吃起來帶有一點淡淡的青草香氣。', '夏天喝起來覺得特別順口降火。', '用粗吸管一吸就會整塊滑進嘴裡。', '相比需要一直咀嚼的配料，這個更好吞嚥。'],
        sharedTrait: '都是手搖飲店常見的黑色加料奶茶。',
        diffPoint: '配料不同：一個是Q彈粉圓，一個是滑嫩草本凍。'
    },
    {
        category: '台灣美食',
        wordA: '麥當勞', cluesA: ['全球知名的連鎖速食店。', '遠遠就能看到大大的黃色M字招牌。', '大家最常點漢堡、薯條配可樂。', '他們的細長薯條剛炸好非常酥脆。', '很多門市半夜還有開得來速。', '以前門口常看到紅頭髮的吉祥物。'],
        wordB: '肯德基', cluesB: ['非常有名的連鎖速食餐廳。', '招牌上有一位戴眼鏡的白鬍子老爺爺。', '主打商品是外酥內嫩的炸雞。', '很多人進去其實是為了買蛋撻。', '紅白相間的炸雞桶非常有代表性。', '除了炸雞之外也有賣紙包雞。'],
        sharedTrait: '都是台灣常見的跨國美式連鎖速食品牌。',
        diffPoint: '品牌與主打不同：漢堡薯條為主 vs 炸雞蛋撻為主。'
    },
    {
        category: '台灣美食',

let game = null;
let streak = parseInt(localStorage.getItem('undercover_streak') || '0', 10);
let lastOfflineIdx = -1;

// 使用者目前選擇的主題與難度
let selectedPresetTheme = localStorage.getItem('undercover_preset_theme') || '隨機';
let customThemeText = localStorage.getItem('undercover_custom_theme') || '';
let selectedDifficulty = localStorage.getItem('undercover_difficulty') || 'normal';

// 背景預載狀態
let preloadedData = null;
let preloadPromise = null;
let preloadPromiseKey = null;
let preloadController = null;

function getActiveTheme() {
    const custom = customThemeText.trim();
    return custom || selectedPresetTheme || '隨機';
}

function getSettings() {
    return {
        mode: localStorage.getItem('undercover_mode') || 'offline',
        apiKey: localStorage.getItem('undercover_apikey') || '',
        model: localStorage.getItem('undercover_model') || 'gemini-3.5-flash-lite'
    };
}

function getConfigKey() {
    const s = getSettings();
    return `${s.mode}|${s.model}|${getActiveTheme()}|${selectedDifficulty}`;
}

// 歷史黑名單（防重複）
function getHistory() {
    try {
        return JSON.parse(localStorage.getItem('undercover_history') || '[]');
    } catch {
        return [];
    }
}

function addToHistory(wordA, wordB) {
    const list = getHistory();
    const pairStr = `${wordA}/${wordB}`;
    if (!list.includes(pairStr)) {
        list.unshift(pairStr);
        if (list.length > 25) list.length = 25;
        localStorage.setItem('undercover_history', JSON.stringify(list));
    }
}

function clearHistory() {
    localStorage.removeItem('undercover_history');
    updateHistoryCountUI();
}

function updateHistoryCountUI() {
    const el = document.getElementById('history-count-text');
    if (el) el.textContent = `防重複黑名單：已記錄 ${getHistory().length} 組詞彙`;
}

// 主題與難度 UI 初始化
function initSetupUI() {
    const chipsContainer = document.getElementById('theme-chips');
    chipsContainer.innerHTML = PRESET_THEMES.map(t => {
        const isActive = !customThemeText.trim() && selectedPresetTheme === t;
        return `<button class="chip ${isActive ? 'active' : ''}" onclick="selectPresetTheme('${t}')">${t}</button>`;
    }).join('');

    document.getElementById('custom-theme-input').value = customThemeText;
    updateDifficultyUI();
    updateSummaryBadges();
}

function toggleSetupPanel() {
    const body = document.getElementById('setup-body');
    const arrow = document.getElementById('setup-arrow');
    const isCollapsed = body.classList.toggle('collapsed');
    arrow.textContent = isCollapsed ? '展開調整 ▼' : '收合 ▲';
}

function selectPresetTheme(theme) {
    selectedPresetTheme = theme;
    customThemeText = '';
    document.getElementById('custom-theme-input').value = '';
    localStorage.setItem('undercover_preset_theme', theme);
    localStorage.setItem('undercover_custom_theme', '');
    initSetupUI();
    invalidatePreload();
}

function onCustomThemeInput() {
    customThemeText = document.getElementById('custom-theme-input').value;
    localStorage.setItem('undercover_custom_theme', customThemeText);
    const chips = document.querySelectorAll('#theme-chips .chip');
    chips.forEach(c => {
        if (customThemeText.trim()) {
            c.classList.remove('active');
        } else {
            c.classList.toggle('active', c.textContent === selectedPresetTheme);
        }
    });
    updateSummaryBadges();
    invalidatePreload();
}

function selectDifficulty(diff) {
    selectedDifficulty = diff;
    localStorage.setItem('undercover_difficulty', diff);
    updateDifficultyUI();
    updateSummaryBadges();
    invalidatePreload();
}

function updateDifficultyUI() {
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.diff === selectedDifficulty);
    });
}

function updateSummaryBadges() {
    const theme = getActiveTheme();
    const diff = DIFF_CONFIG[selectedDifficulty] || DIFF_CONFIG.normal;
    document.getElementById('summary-theme').textContent = `主題：${theme}`;
    const diffEl = document.getElementById('summary-diff');
    diffEl.textContent = `難度：${diff.label}`;
    diffEl.className = `mini-badge diff-${selectedDifficulty}`;
}

function applySetupAndRestart() {
    document.getElementById('setup-body').classList.add('collapsed');
    document.getElementById('setup-arrow').textContent = '展開調整 ▼';
    startNewGame();
}

// 設定彈窗
function openSettings() {
    const s = getSettings();
    document.getElementById('setting-mode').value = s.mode;
    document.getElementById('setting-apikey').value = s.apiKey;
    document.getElementById('setting-model').value = s.model;
    updateHistoryCountUI();
    document.getElementById('settings-overlay').classList.add('show');
}

function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('show');
}

function saveSettings() {
    const mode = document.getElementById('setting-mode').value;
    const apiKey = document.getElementById('setting-apikey').value.trim();
    const model = document.getElementById('setting-model').value;
    localStorage.setItem('undercover_mode', mode);
    localStorage.setItem('undercover_apikey', apiKey);
    localStorage.setItem('undercover_model', model);
    invalidatePreload();
    closeSettings();
    startNewGame();
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// 預載狀態 UI
function setPreloadBadge(state) {
    const el = document.getElementById('preload-badge');
    if (state === 'loading') {
        el.className = 'preload-badge loading';
        el.textContent = '⏳ 預載下一題中...';
    } else if (state === 'ready') {
        el.className = 'preload-badge ready';
        el.textContent = '⚡ 下一題已就緒';
    } else {
        el.className = 'preload-badge';
        el.textContent = '';
    }
}

function invalidatePreload() {
    preloadedData = null;
    preloadPromise = null;
    preloadPromiseKey = null;
    if (preloadController) {
        preloadController.abort();
        preloadController = null;
    }
    setPreloadBadge('idle');
}

// 呼叫 Gemini API（v4 平衡版：同時約束「高度相似」與「本質不同」）
async function fetchFromGemini(apiKey, preferredModel, themeInput, difficulty, externalSignal = null) {
    const randomThemes = PRESET_THEMES.filter(t => t !== '隨機');
    const actualTheme = (themeInput === '隨機')
        ? randomThemes[Math.floor(Math.random() * randomThemes.length)]
        : themeInput;

    const diffRule = (DIFF_CONFIG[difficulty] || DIFF_CONFIG.normal).promptRule;
    const history = getHistory();
    const avoidText = history.length > 0
        ? `請絕對不要重複以下最近玩過的詞彙：${history.slice(0, 20).join('、')}。`
        : '';

    const prompt = `你現在是「誰是臥底」桌遊的專業出題引擎。
主題：「${actualTheme}」
${diffRule}
${avoidText}

【出題黃金平衡原則（極重要）】：
1. 兩者必須屬於「同一個細分類」，且外觀、功能或使用情境高度重疊（讓玩家聽第1輪時很容易搞混）。
2. 同時，兩者必須是「現實中不同的兩種事物」。
   - ❌ 嚴格禁止「太像／同義詞／異體字／別稱」：如「大腸包小腸 vs 糯米腸包香腸」、「魷魚羹 vs 魷魚焿」、「番茄 vs 西紅柿」。
   - ❌ 嚴格禁止「太遠／不同功能物品」：如「悠遊卡 vs 行李箱」、「高鐵 vs 護照」、「手機 vs 電視」。
   - ✅ 完美示範（同細類、相似但本質不同）：「悠遊卡 vs 信用卡」、「行李箱 vs 後背包」、「蚵仔煎 vs 蝦仁煎」、「高鐵 vs 自強號」、「藍牙耳機 vs 有線耳機」。
3. 請先思考並填寫 shared_trait（兩者的高度共通點）與 diff_point（兩者的實質差異），確認兩者「既很像、又真的不同」再寫線索！

請用台灣繁體中文輸出純JSON：
- civ_word：平民詞
- spy_word：臥底詞
- shared_trait：兩者高度相似的共通點（12~22字）
- diff_point：兩者在實體、食材或功能上的關鍵差異（12~25字）
- civ_clues：6句不重複的平民線索（每句15~28字，口氣自然，不可包含詞彙本身的字）
- spy_clues：2句不重複的臥底線索（每句15~28字，口氣自然，不可包含詞彙本身的字；第1句可偏共通點，第2句需暗藏可推理的實質差異）

格式：{"civ_word":"","spy_word":"","shared_trait":"","diff_point":"","civ_clues":["","","","","",""],"spy_clues":["",""]}`;

    const modelOrder = [preferredModel, 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite']
        .filter((v, i, a) => a.indexOf(v) === i);

    let lastErr = null;
    for (const model of modelOrder) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        const onExternalAbort = () => controller.abort();
        if (externalSignal) {
            if (externalSignal.aborted) {
                clearTimeout(timer);
                throw new DOMException('Aborted', 'AbortError');
            }
            externalSignal.addEventListener('abort', onExternalAbort, { once: true });
        }

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: 'application/json', temperature: 0.9, maxOutputTokens: 950 }
                })
            });
            clearTimeout(timer);
            if (externalSignal) externalSignal.removeEventListener('abort', onExternalAbort);

            if (!res.ok) {
                lastErr = new Error(`HTTP ${res.status}`);
                if (res.status === 503 || res.status === 429) continue;
                throw lastErr;
            }
            const json = await res.json();
            const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const data = JSON.parse(rawText);
            if (
                !data.civ_word || !data.spy_word ||
                data.civ_word.trim() === data.spy_word.trim() ||
                data.civ_clues?.length < 6 || data.spy_clues?.length < 2
            ) {
                throw new Error('格式異常或詞彙重複');
            }
            return { data, theme: actualTheme, model };
        } catch (e) {
            clearTimeout(timer);
            if (externalSignal) externalSignal.removeEventListener('abort', onExternalAbort);
            if (externalSignal && externalSignal.aborted) throw e;
            lastErr = e;
        }
    }
    throw lastErr || new Error('連線失敗');
}

// 背景預先載入下一題
function triggerBackgroundPreload() {
    const s = getSettings();
    if (s.mode !== 'ai' || !s.apiKey) {
        setPreloadBadge('idle');
        return;
    }

    const key = getConfigKey();
    if (preloadedData && preloadedData.key === key) {
        setPreloadBadge('ready');
        return;
    }
    if (preloadPromise && preloadPromiseKey === key) {
        return;
    }

    invalidatePreload();
    preloadController = new AbortController();
    preloadPromiseKey = key;
    setPreloadBadge('loading');

    const theme = getActiveTheme();
    const diff = selectedDifficulty;

    preloadPromise = fetchFromGemini(s.apiKey, s.model, theme, diff, preloadController.signal)
        .then(res => {
            if (preloadPromiseKey === key) {
                preloadedData = { key, ...res };
                setPreloadBadge('ready');
            }
            return res;
        })
        .catch(() => {
            if (preloadPromiseKey === key) {
                setPreloadBadge('idle');
            }
            return null;
        })
        .finally(() => {
            if (preloadPromiseKey === key) {
                preloadPromise = null;
            }
        });
}

async function startNewGame() {
    const s = getSettings();
    const activeTheme = getActiveTheme();
    const diff = DIFF_CONFIG[selectedDifficulty] || DIFF_CONFIG.normal;
    const currentKey = getConfigKey();

    let civWord, spyWord, sharedTrait = '', diffPoint = '', civClues, spyClues, modeText = '內建題庫';
    let notice = '';

    if (s.mode === 'ai' && s.apiKey) {
        if (preloadedData && preloadedData.key === currentKey) {
            const res = preloadedData;
            preloadedData = null;
            setPreloadBadge('idle');
            civWord = res.data.civ_word;
            spyWord = res.data.spy_word;
            sharedTrait = res.data.shared_trait || '';
            diffPoint = res.data.diff_point || '';
            civClues = shuffle(res.data.civ_clues);
            spyClues = res.data.spy_clues;
            modeText = `AI 出題（${res.theme}）`;
        } else {
            document.getElementById('loading-overlay').classList.add('show');
            try {
                let res = null;
                if (preloadPromise && preloadPromiseKey === currentKey) {
                    res = await preloadPromise;
                    if (preloadedData && preloadedData.key === currentKey) {
                        res = preloadedData;
                        preloadedData = null;
                    }
                }
                if (!res) {
                    res = await fetchFromGemini(s.apiKey, s.model, activeTheme, selectedDifficulty);
                }
                civWord = res.data.civ_word;
                spyWord = res.data.spy_word;
                sharedTrait = res.data.shared_trait || '';
                diffPoint = res.data.diff_point || '';
                civClues = shuffle(res.data.civ_clues);
                spyClues = res.data.spy_clues;
                modeText = `AI 出題（${res.theme}）`;
            } catch (err) {
                notice = `⚠️ AI 暫時忙碌（${err.name === 'AbortError' ? '超時' : err.message}），已自動切換內建題庫。`;
            } finally {
                document.getElementById('loading-overlay').classList.remove('show');
            }
        }
    }

    // 離線題庫（支援主題篩選）
    if (!civWord) {
        let pool = OFFLINE_BANK;
        if (activeTheme !== '隨機') {
            const filtered = OFFLINE_BANK.filter(item => item.category === activeTheme);
            if (filtered.length > 0) pool = filtered;
        }
        let idx;
        if (pool.length === 1) {
            idx = 0;
        } else {
            do { idx = Math.floor(Math.random() * pool.length); } while (pool === OFFLINE_BANK && idx === lastOfflineIdx);
        }
        if (pool === OFFLINE_BANK) lastOfflineIdx = idx;

        const pair = pool[idx];
        const swap = Math.random() < 0.5;
        civWord = swap ? pair.wordB : pair.wordA;
        spyWord = swap ? pair.wordA : pair.wordB;
        sharedTrait = pair.sharedTrait || '';
        diffPoint = pair.diffPoint || '';
        civClues = shuffle(swap ? pair.cluesB : pair.cluesA);
        spyClues = shuffle(swap ? pair.cluesA : pair.cluesB);
        modeText = `內建題庫（${pair.category}）`;
    }

    addToHistory(civWord, spyWord);

    const spyId = Math.floor(Math.random() * BOTS.length);
    let cIdx = 0;
    const players = BOTS.map(b => {
        const isSpy = b.id === spyId;
        return {
            ...b,
            isSpy,
            word: isSpy ? spyWord : civWord,
            clues: {
                1: isSpy ? spyClues[0] : civClues[cIdx++],
                2: isSpy ? spyClues[1] : civClues[cIdx++]
            },
            eliminated: false
        };
    });

    game = {
        players,
        spyId,
        civWord,
        spyWord,
        sharedTrait,
        diffPoint,
        hintWords: shuffle([civWord, spyWord]),
        round: 1,
        maxRounds: 2,
        chances: diff.chances,
        showHint: false,
        status: 'playing',
        modeText,
        message: notice || (selectedDifficulty === 'hell'
            ? '🔥 地獄模式啟動！只有 1 次指認機會，請仔細揪出微小的破綻！'
            : '第 1 輪發言完畢！請觀察誰的描述跟大家不太一樣。')
    };

    render();

    setTimeout(() => triggerBackgroundPreload(), 600);
}

function nextRound() {
    if (game.round < game.maxRounds && game.status === 'playing') {
        game.round++;
        game.message = '已進入第 2 輪發言！這是最後一輪線索，找出真正的臥底吧。';
        render();
    }
}

function toggleHint() {
    game.showHint = true;
    render();
}

function accuse(playerId) {
    if (game.status !== 'playing') return;
    const p = game.players.find(x => x.id === playerId);
    if (!p || p.eliminated) return;

    if (p.isSpy) {
        game.status = 'won';
        streak++;
        localStorage.setItem('undercover_streak', streak);
        game.message = `🎉 推理成功！${p.name} 就是隱藏在其中的臥底！`;
    } else {
        p.eliminated = true;
        game.chances--;
        if (game.chances <= 0) {
            game.status = 'lost';
            streak = 0;
            localStorage.setItem('undercover_streak', streak);
            const spy = game.players.find(x => x.isSpy);
            game.message = `💀 推理失敗！${p.name} 只是平民，真正的臥底是 ${spy.name}！`;
        } else {
            game.message = `❌ 猜錯了！${p.name} 是平民（已排除），還剩 ${game.chances} 次機會！`;
        }
    }
    render();
}

function render() {
    document.getElementById('mode-label').textContent = `目前模式：${game.modeText}`;
    document.getElementById('stat-round').textContent = `第 ${game.round} / ${game.maxRounds} 輪`;
    document.getElementById('stat-chances').textContent = `❤️ ${game.chances} 次`;
    document.getElementById('stat-streak').textContent = `🔥 ${streak} 連勝`;

    const msgBox = document.getElementById('message-box');
    msgBox.className = `message-box ${game.status}`;
    msgBox.textContent = game.message;

    const hintBox = document.getElementById('hint-box');
    if (game.showHint && game.status === 'playing') {
        hintBox.style.display = 'block';
        hintBox.innerHTML = `💡 本局詞彙：「<strong>${game.hintWords[0]}</strong>」與「<strong>${game.hintWords[1]}</strong>」`;
    } else {
        hintBox.style.display = 'none';
    }

    const ansBox = document.getElementById('answer-reveal');
    if (game.status !== 'playing') {
        ansBox.style.display = 'flex';
        let metaHtml = '';
        if (game.sharedTrait || game.diffPoint) {
            metaHtml = `<div class="answer-meta">`
                + (game.sharedTrait ? `<div>🔗 共通點：${game.sharedTrait}</div>` : '')
                + (game.diffPoint ? `<div>🔍 關鍵差異：${game.diffPoint}</div>` : '')
                + `</div>`;
        }
        ansBox.innerHTML = `<div class="answer-words"><div>👤 平民：<strong style="color:var(--accent)">${game.civWord}</strong></div><div>🕵️ 臥底：<strong style="color:var(--danger)">${game.spyWord}</strong></div></div>${metaHtml}`;
    } else {
        ansBox.style.display = 'none';
    }

    const isEnded = game.status !== 'playing';
    const container = document.getElementById('players-container');
    container.innerHTML = game.players.map(p => {
        let cls = 'player-card';
        if (p.eliminated) cls += ' eliminated';
        if (isEnded && p.isSpy) cls += ' spy-reveal';

        let tagHtml = '';
        if (isEnded) {
            tagHtml = `<span class="tag ${p.isSpy ? 'tag-spy' : 'tag-civ'}">${p.isSpy ? '臥底' : '平民'}（${p.word}）</span>`;
        } else if (p.eliminated) {
            tagHtml = `<span class="tag tag-civ">已排除（平民）</span>`;
        }

        let cluesHtml = '';
        for (let r = 1; r <= game.round; r++) {
            cluesHtml += `<div class="clue-item"><span class="clue-round">第 ${r} 輪發言</span>「${p.clues[r]}」</div>`;
        }

        const btnHtml = (!isEnded && !p.eliminated)
            ? `<button class="btn btn-accuse" onclick="accuse(${p.id})">👉 指認 ${p.name} 是臥底</button>`
            : '';

        return `
            <div class="${cls}">
                <div class="player-header">
                    <div class="player-name">${p.avatar} ${p.name}</div>
                    ${tagHtml}
                </div>
                ${cluesHtml}
                ${btnHtml}
            </div>
        `;
    }).join('');

    const controls = document.getElementById('controls');
    if (!isEnded) {
        let html = '';
        if (game.round < game.maxRounds) {
            html += `<button class="btn btn-primary" onclick="nextRound()">💬 聽取第 ${game.round + 1} 輪發言</button>`;
        }
        html += `<div class="controls-row">`;
        html += !game.showHint
            ? `<button class="btn btn-warning" onclick="toggleHint()">💡 查看詞彙提示</button>`
            : `<button class="btn btn-secondary" disabled>已顯示提示</button>`;
        html += `<button class="btn btn-secondary" onclick="startNewGame()">🔄 換一局</button>`;
        html += `</div>`;
        controls.innerHTML = html;
    } else {
        controls.innerHTML = `<button class="btn btn-primary" onclick="startNewGame()">🎮 再玩一局</button>`;
    }
}

// 啟動遊戲
initSetupUI();
startNewGame();
</script>
