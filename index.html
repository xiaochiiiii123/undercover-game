<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>誰是臥底：AI 偵探版</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 16px 14px 40px;
        }
        .app {
            max-width: 520px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .title-group h1 {
            font-size: 1.35rem;
            color: var(--accent);
        }
        .title-group p {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .icon-btn {
            background: var(--card);
            border: 1px solid #334155;
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .stat-pill {
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
            font-size: 0.82rem;
            font-weight: bold;
        }
        .stat-pill span {
            display: block;
            font-size: 0.72rem;
            color: var(--muted);
            font-weight: normal;
        }
        .message-box {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 0.92rem;
            font-weight: bold;
            background: var(--card);
            border-left: 4px solid var(--accent);
        }
        .message-box.won { background: rgba(34, 197, 94, 0.15); border-left-color: var(--success); color: #86efac; }
        .message-box.lost { background: rgba(239, 68, 68, 0.15); border-left-color: var(--danger); color: #fca5a5; }
        .hint-box {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--warning);
            color: #fde68a;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }
        .answer-reveal {
            background: var(--card);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 0.92rem;
        }
        .players {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }
        .player-card {
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
        }
        .player-card.eliminated { opacity: 0.5; }
        .player-card.spy-reveal { border: 2px solid var(--danger); background: rgba(239, 68, 68, 0.08); }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .player-name {
            font-size: 1.08rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .tag-civ { background: #334155; color: #cbd5e1; }
        .tag-spy { background: var(--danger); color: white; }
        .clue-item {
            background: #0f172a;
            padding: 9px 11px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.92rem;
        }
        .clue-round {
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
        .btn {
            width: 100%;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-accuse { background: var(--danger); color: white; margin-top: 4px; }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-warning { background: var(--warning); color: #0f172a; }
        .btn-secondary { background: #475569; color: white; }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 讀取遮罩 & 設定彈窗 */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
        }
        .modal h2 { font-size: 1.15rem; margin-bottom: 12px; color: var(--accent); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text);
            font-size: 0.9rem;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #334155;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="title-group">
            <h1>🕵️ 誰是臥底：偵探版</h1>
            <p id="mode-label">目前模式：內建題庫</p>
        </div>
        <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
    </header>

    <div class="status-bar">
        <div class="stat-pill"><span>發言進度</span><div id="stat-round">第 1 / 2 輪</div></div>
        <div class="stat-pill"><span>剩餘機會</span><div id="stat-chances">❤️ 2 次</div></div>
        <div class="stat-pill"><span>目前連勝</span><div id="stat-streak">🔥 0 連勝</div></div>
    </div>

    <div id="message-box" class="message-box">載入中...</div>
    <div id="hint-box" class="hint-box" style="display:none;"></div>
    <div id="answer-reveal" class="answer-reveal" style="display:none;"></div>

    <div id="players-container" class="players"></div>

    <div id="controls" class="controls"></div>
</div>

<!-- 讀取中遮罩 -->
<div id="loading-overlay" class="overlay">
    <div style="text-align:center;">
        <div class="spinner"></div>
        <div style="font-weight:bold; color:var(--accent);">🕵️ AI 正在派發題目中...</div>
        <div style="font-size:0.8rem; color:var(--muted); margin-top:4px;">若超過 12 秒將自動切換內建題庫</div>
    </div>
</div>

<!-- 設定彈窗 -->
<div id="settings-overlay" class="overlay">
    <div class="modal">
        <h2>⚙️ 遊戲與 AI 設定</h2>
        <div class="form-group">
            <label>出題模式</label>
            <select id="setting-mode">
                <option value="offline">內建題庫（免等待、離線可玩）</option>
                <option value="ai">Gemini AI 即時出題（需填 API Key）</option>
            </select>
        </div>
        <div class="form-group">
            <label>Gemini API Key（僅儲存在你的手機瀏覽器）</label>
            <input type="password" id="setting-apikey" placeholder="貼上你的 API Key">
        </div>
        <div class="form-group">
            <label>AI 模型選擇</label>
            <select id="setting-model">
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（最快）</option>
                <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
                <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                <option value="gemini-4-hydrogen">gemini-4-hydrogen</option>
            </select>
        </div>
        <div class="controls-row">
            <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
            <button class="btn btn-primary" onclick="saveSettings()">儲存並開新局</button>
        </div>
    </div>
</div>

<script>
const BOTS = [
    { id: 0, name: '小宇', avatar: '🦊' },
    { id: 1, name: '阿豪', avatar: '🐻' },
    { id: 2, name: '曉彤', avatar: '🐰' },
    { id: 3, name: '凱文', avatar: '🦉' }
];

// 內建 12 組台灣生活題庫
const OFFLINE_BANK = [
    {
        wordA: '珍珠奶茶', cluesA: ['台灣最經典的國民手搖飲料。', '喝的時候一定要用比較粗的吸管。', '裡面有黑色圓圓的配料，嚼起來很Q。', '外國觀光客來台灣幾乎必點。', '熱量不低但下午茶喝一杯超療癒。', '通常可以選加奶精或鮮奶。'],
        wordB: '仙草凍奶茶', cluesB: ['飲料店常見的黑色加料奶茶。', '配料口感滑溜軟嫩，幾乎不用用力咬。', '吃起來帶有一點淡淡的青草香氣。', '夏天喝起來覺得特別順口降火。', '用粗吸管一吸就會整塊滑進嘴裡。', '相比需要一直咀嚼的配料，這個更好吞嚥。']
    },
    {
        wordA: '麥當勞', cluesA: ['全球知名的連鎖速食店。', '遠遠就能看到大大的黃色M字招牌。', '大家最常點漢堡、薯條配可樂。', '他們的細長薯條剛炸好非常酥脆。', '很多門市半夜還有開得來速。', '以前門口常看到紅頭髮的吉祥物。'],
        wordB: '肯德基', cluesB: ['非常有名的連鎖速食餐廳。', '招牌上有一位戴眼鏡的白鬍子老爺爺。', '主打商品是外酥內嫩的炸雞。', '很多人進去其實是為了買蛋撻。', '紅白相間的炸雞桶非常有代表性。', '除了炸雞之外也有賣紙包雞。']
    },
    {
        wordA: '鹹酥雞', cluesA: ['台灣夜市裡少不了的國民宵夜。', '通常是小塊的炸肉，用竹籤叉著吃。', '起鍋時老闆一定會撒上胡椒鹽。', '一定要配九層塔和蒜頭才對味。', '點餐時大家常會順便夾甜不辣或四季豆。', '裝在紙袋裡邊走邊吃超香。'],
        wordB: '雞排', cluesB: ['超受歡迎的台灣油炸小吃。', '份量很大，有時候拿起來比臉還大。', '外皮炸得酥脆，咬下去裡面很多汁。', '買的時候老闆常問要不要切、要不要加辣。', '剛炸好很燙手，整片直接咬最過癮。', '宵夜吃這一片基本上就能當一餐。']
    },
    {
        wordA: '高鐵', cluesA: ['台灣西部南北往來的重要交通工具。', '速度非常快，台北到高雄不到兩小時。', '車廂寬敞舒適，有分標準與商務車廂。', '票價在陸上交通工具中算比較貴的。', '很多車站蓋在郊區，常需要轉乘接駁車。', '返鄉或出差趕時間時的首選。'],
        wordB: '台鐵', cluesB: ['台灣歷史最悠久的鐵路系統。', '路線幾乎環繞全台，站點非常密集。', '車種分很多種，有快車也有站站停的區間車。', '除了搭車之外，排骨便當也非常出名。', '票價親民，是許多學生通勤的選擇。', '車站大多位於市中心，下車就能逛街。']
    },
    {
        wordA: '貓咪', cluesA: ['現代人非常喜歡飼養的毛小孩。', '個性比較獨立，叫牠也不一定會理你。', '每天花很多時間睡覺和舔毛。', '超喜歡鑽進紙箱或跳到高櫃子上。', '開心放鬆時喉嚨會發出呼嚕呼嚕聲。', '上完廁所會自己撥砂蓋起來。'],
        wordB: '狗狗', cluesB: ['人類最忠實常見的寵物之一。', '非常黏人，看到主人回家會興奮衝過來。', '每天通常需要帶出門散步和上廁所。', '開心時會一直搖尾巴，甚至翻肚子討摸。', '能聽懂坐下、握手等簡單指令。', '不同品種的體型差異非常大。']
    },
    {
        wordA: '滷肉飯', cluesA: ['台灣巷口小吃店必備的國民美食。', '白飯上淋滿燉到入味的肉燥與醬汁。', '吃起來鹹香下飯，有時帶點膠質黏口感。', '通常一碗銅板價，配顆滷蛋超滿足。', '南北部的稱呼和肥瘦比例不太一樣。', '香味濃郁，是很多人肚子餓的首選。'],
        wordB: '雞肉飯', cluesB: ['台灣非常受歡迎的平價傳統飯食。', '白飯上鋪滿撕成一絲一絲的肉。', '淋上特製油蔥酥和香噴噴的醬汁。', '說到這道料理大家第一個會想到嘉義。', '吃起來相對清爽不油膩，非常順口。', '通常會配上一片黃色的醃蘿蔔。']
    },
    {
        wordA: '7-11', cluesA: ['台灣街頭巷尾最常見的超商之一。', '招牌是綠、橘、紅三種顏色組成的。', '店裡的思樂冰和霜淇淋很受歡迎。', '很多人每天早上都會去買它的現煮咖啡。', '除了買東西還能寄包裹、繳費和買車票。', '吉祥物是一隻頭上有彩虹的可愛角色。'],
        wordB: '全家', cluesB: ['台灣隨處可見的24小時便利商店。', '招牌主要是藍色和綠色的配色。', '他們的霜淇淋口味常常推陳出新，網路討論度超高。', '進去門口時會聽到非常經典的登登登音樂。', 'App裡的寄杯和友善食光功能很多人用。', '半夜肚子餓隨時走進去都能買到微波便當。']
    },
    {
        wordA: '電影院', cluesA: ['週末約會或跟朋友聚會的熱門室內場所。', '進去後大家都要把手機關靜音。', '現場有超大螢幕和震撼的環繞音響。', '很多人入場前一定會買爆米花和可樂。', '冷氣通常開得很強，坐久了會有點冷。', '燈光暗下來後大家就會安靜看著前方。'],
        wordB: 'KTV', cluesB: ['朋友慶生、聚餐續攤最愛去的室內娛樂場所。', '通常會待在獨立的包廂裡，不會吵到外面。', '裡面有螢幕和麥克風，大家輪流點歌。', '很多人去這裡其實是為了點他們的牛肉麵或水餃。', '常常一待就是三、四個小時，甚至唱通宵。', '氣氛很嗨，有時還會有人一直插播。']
    },
    {
        wordA: '機車', cluesA: ['台灣路上數量最多的個人交通工具。', '停紅燈時前面會有一整排專屬停等區。', '體積小好鑽車縫，在市區找車位比較方便。', '騎乘時一定要戴安全帽，不然會被開罰單。', '下雨天騎出門得穿雨衣，稍微有點麻煩。', '需要定期去加油站加油或去換電站換電池。'],

    },
    {
        wordA: '牙刷', cluesA: ['每天起床和睡前都會用到的浴室用品。', '頂端有一排細軟的毛用來清潔口腔。', '用久了前端會開花變形，需要定期更換。', '有傳統手動的，也有充電震動的款式。', '住飯店時通常會附贈拋棄式的。', '每次用完都要甩乾直立放好。'],

    },

        wordA: '冷氣', cluesA: ['台灣夏天絕對不能沒有的居家救命家電。', '開太久電費會暴增，所以大家很在意變頻省電。', '通常會掛在牆壁高處，用遙控器調整溫度。', '濾網用久了會積灰塵，需要定期拆下來洗。', '睡覺時常會設定定時關閉或舒眠模式。', '一打開整個房間很快就會變得涼爽乾燥。'],

    },
    {

    }
];

let game = null;
let streak = parseInt(localStorage.getItem('undercover_streak') || '0', 10);
let lastOfflineIdx = -1;

function getSettings() {
    return {
        mode: localStorage.getItem('undercover_mode') || 'offline',
        apiKey: localStorage.getItem('undercover_apikey') || '',
        model: localStorage.getItem('undercover_model') || 'gemini-3.5-flash-lite'
    };
}

function openSettings() {
    const s = getSettings();
    document.getElementById('setting-mode').value = s.mode;
    document.getElementById('setting-apikey').value = s.apiKey;
    document.getElementById('setting-model').value = s.model;
    document.getElementById('settings-overlay').classList.add('show');
}

function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('show');
}

function saveSettings() {
    const mode = document.getElementById('setting-mode').value;
    const apiKey = document.getElementById('setting-apikey').value.trim();
    const model = document.getElementById('setting-model').value;
    localStorage.setItem('undercover_mode', mode);
    localStorage.setItem('undercover_apikey', apiKey);
    localStorage.setItem('undercover_model', model);
    closeSettings();
    startNewGame();
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

async function fetchFromGemini(apiKey, model) {
    const themes = ['台灣小吃與飲料', '日常用品', '動物與寵物', '交通工具', '校園與職場', '3C科技', '休閒娛樂', '居家家電'];
    const theme = themes[Math.floor(Math.random() * themes.length)];
    const prompt = `你現在是「誰是臥底」遊戲引擎。請以「${theme}」為主題，用台灣繁體中文出一組高度相似但不同的詞彙（civ_word 平民詞、spy_word 臥底詞），為平民詞寫6句不重複線索（civ_clues），為臥底詞寫2句不重複線索（spy_clues），每句15~28字，口氣自然且不可包含詞彙本身的字。請直接輸出純JSON：{"civ_word":"","spy_word":"","civ_clues":["","","","","",""],"spy_clues":["",""]}`;

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: 'application/json', temperature: 1.0, maxOutputTokens: 800 }
            })
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const data = JSON.parse(rawText);
        if (!data.civ_word || !data.spy_word || data.civ_clues?.length < 6 || data.spy_clues?.length < 2) {
            throw new Error('格式異常');
        }
        return { data, theme };
    } catch (e) {
        clearTimeout(timer);
        throw e;
    }
}

async function startNewGame() {
    const s = getSettings();
    let civWord, spyWord, civClues, spyClues, modeText = '內建題庫';
    let notice = '';

    if (s.mode === 'ai' && s.apiKey) {
        document.getElementById('loading-overlay').classList.add('show');
        try {
            const res = await fetchFromGemini(s.apiKey, s.model);
            civWord = res.data.civ_word;
            spyWord = res.data.spy_word;
            civClues = shuffle(res.data.civ_clues);
            spyClues = shuffle(res.data.spy_clues);
            modeText = `AI 出題（${res.theme}）`;
        } catch (err) {
            notice = `⚠️ AI 暫時忙碌（${err.name === 'AbortError' ? '超時' : err.message}），已自動切換內建題庫。`;
        } finally {
            document.getElementById('loading-overlay').classList.remove('show');
        }
    }

    if (!civWord) {
        let idx;
        do { idx = Math.floor(Math.random() * OFFLINE_BANK.length); } while (idx === lastOfflineIdx && OFFLINE_BANK.length > 1);
        lastOfflineIdx = idx;
        const pair = OFFLINE_BANK[idx];
        const swap = Math.random() < 0.5;
        civWord = swap ? pair.wordB : pair.wordA;
        spyWord = swap ? pair.wordA : pair.wordB;
        civClues = shuffle(swap ? pair.cluesB : pair.cluesA);
        spyClues = shuffle(swap ? pair.cluesA : pair.cluesB);
    }

    const spyId = Math.floor(Math.random() * BOTS.length);
    let cIdx = 0, sIdx = 0;
    const players = BOTS.map(b => {
        const isSpy = b.id === spyId;
        return {
            ...b,
            isSpy,
            word: isSpy ? spyWord : civWord,
            clues: {
                1: isSpy ? spyClues[sIdx++] : civClues[cIdx++],
                2: isSpy ? spyClues[sIdx++] : civClues[cIdx++]
            },
            eliminated: false
        };
    });

    game = {
        players,
        spyId,
        civWord,
        spyWord,
        hintWords: shuffle([civWord, spyWord]),
        round: 1,
        maxRounds: 2,
        chances: 2,
        showHint: false,
        status: 'playing',
        modeText,
        message: notice || '第 1 輪發言完畢！請觀察誰的描述跟大家不太一樣。'
    };

    render();
}

function nextRound() {
    if (game.round < game.maxRounds && game.status === 'playing') {
        game.round++;
        game.message = '已進入第 2 輪發言！這是最後一輪線索，找出真正的臥底吧。';
        render();
    }
}

function toggleHint() {
    game.showHint = true;
    render();
}

function accuse(playerId) {
    if (game.status !== 'playing') return;
    const p = game.players.find(x => x.id === playerId);
    if (!p || p.eliminated) return;

    if (p.isSpy) {
        game.status = 'won';
        streak++;
        localStorage.setItem('undercover_streak', streak);
        game.message = `🎉 推理成功！${p.name} 就是隱藏在其中的臥底！`;
    } else {
        p.eliminated = true;
        game.chances--;
        if (game.chances <= 0) {
            game.status = 'lost';
            streak = 0;
            localStorage.setItem('undercover_streak', streak);
            const spy = game.players.find(x => x.isSpy);
            game.message = `💀 推理失敗！${p.name} 只是平民，真正的臥底是 ${spy.name}！`;
        } else {
            game.message = `❌ 猜錯了！${p.name} 是平民（已排除），還剩 ${game.chances} 次機會！`;
        }
    }
    render();
}

function render() {
    document.getElementById('mode-label').textContent = `目前模式：${game.modeText}`;
    document.getElementById('stat-round').textContent = `第 ${game.round} / ${game.maxRounds} 輪`;
    document.getElementById('stat-chances').textContent = `❤️ ${game.chances} 次`;
    document.getElementById('stat-streak').textContent = `🔥 ${streak} 連勝`;

    const msgBox = document.getElementById('message-box');
    msgBox.className = `message-box ${game.status}`;
    msgBox.textContent = game.message;

    const hintBox = document.getElementById('hint-box');
    if (game.showHint && game.status === 'playing') {
        hintBox.style.display = 'block';
        hintBox.innerHTML = `💡 本局詞彙：「<strong>${game.hintWords[0]}</strong>」與「<strong>${game.hintWords[1]}</strong>」`;
    } else {
        hintBox.style.display = 'none';
    }

    const ansBox = document.getElementById('answer-reveal');
    if (game.status !== 'playing') {
        ansBox.style.display = 'flex';
        ansBox.innerHTML = `<div>👤 平民：<strong style="color:var(--accent)">${game.civWord}</strong></div><div>🕵️ 臥底：<strong style="color:var(--danger)">${game.spyWord}</strong></div>`;
    } else {
        ansBox.style.display = 'none';
    }

    const isEnded = game.status !== 'playing';
    const container = document.getElementById('players-container');
    container.innerHTML = game.players.map(p => {
        let cls = 'player-card';
        if (p.eliminated) cls += ' eliminated';
        if (isEnded && p.isSpy) cls += ' spy-reveal';

        let tagHtml = '';
        if (isEnded) {
            tagHtml = `<span class="tag ${p.isSpy ? 'tag-spy' : 'tag-civ'}">${p.isSpy ? '臥底' : '平民'}（${p.word}）</span>`;
        } else if (p.eliminated) {
            tagHtml = `<span class="tag tag-civ">已排除（平民）</span>`;
        }

        let cluesHtml = '';
        for (let r = 1; r <= game.round; r++) {
            cluesHtml += `<div class="clue-item"><span class="clue-round">第 ${r} 輪發言</span>「${p.clues[r]}」</div>`;
        }

        const btnHtml = (!isEnded && !p.eliminated)
            ? `<button class="btn btn-accuse" onclick="accuse(${p.id})">👉 指認 ${p.name} 是臥底</button>`
            : '';

        return `
            <div class="${cls}">
                <div class="player-header">
                    <div class="player-name">${p.avatar} ${p.name}</div>
                    ${tagHtml}
                </div>
                ${cluesHtml}
                ${btnHtml}
            </div>
        `;
    }).join('');

    const controls = document.getElementById('controls');
    if (!isEnded) {
        let html = '';
        if (game.round < game.maxRounds) {
            html += `<button class="btn btn-primary" onclick="nextRound()">💬 聽取第 ${game.round + 1} 輪發言</button>`;
        }
        html += `<div class="controls-row">`;
        html += !game.showHint
            ? `<button class="btn btn-warning" onclick="toggleHint()">💡 查看詞彙提示</button>`
            : `<button class="btn btn-secondary" disabled>已顯示提示</button>`;
        html += `<button class="btn btn-secondary" onclick="startNewGame()">🔄 換一局</button>`;
        html += `</div>`;
        controls.innerHTML = html;
    } else {
        controls.innerHTML = `<button class="btn btn-primary" onclick="startNewGame()">🎮 再玩一局</button>`;
    }
}

// 啟動遊戲
startNewGame();
</script>
</body>
</html>
